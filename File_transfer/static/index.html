<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Transfer — Utilities</title>
<style>
:root{
  --bg:#fff;--bg-secondary:#f8f9fa;--bg-tertiary:#f1f3f5;
  --text:#1a1a2e;--text-secondary:#495057;--text-muted:#868e96;
  --border:#dee2e6;--border-light:#e9ecef;--accent:#4c6ef5;
  --accent-hover:#3b5de7;--accent-light:#edf2ff;--success:#2b8a3e;
  --success-light:#ebfbee;--danger:#c92a2a;--danger-light:#fff5f5;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.06);
  --radius:8px;--radius-sm:5px;
  --font-mono:'SF Mono','Cascadia Code','JetBrains Mono','Fira Code','Consolas',monospace;
  --font-sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --bg:#1a1b1e;--bg-secondary:#25262b;--bg-tertiary:#2c2e33;
  --text:#e4e6ea;--text-secondary:#c1c4cd;--text-muted:#9095a0;
  --border:#3a3c42;--border-light:#2e3035;--accent:#6d8af7;
  --accent-hover:#8aa3ff;--accent-light:#1e2640;--success:#40c057;
  --success-light:#0d2b13;--danger:#ff6b6b;--danger-light:#3b0a0a;
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 4px 16px rgba(0,0,0,.4);
}
html{color-scheme:light} [data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:var(--font-sans);background:var(--bg);color:var(--text)}
body{padding:24px}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:1080px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:9px;background:var(--accent-light);display:grid;place-items:center;font-size:21px}
h1{font-size:20px} .subtitle{font-size:13px;color:var(--text-muted);margin-top:2px}
.toolbar{display:flex;gap:8px}
.btn{border:1px solid var(--border);background:var(--bg-secondary);color:var(--text);padding:8px 12px;border-radius:var(--radius-sm);font-size:13px}
.btn:hover{background:var(--bg-tertiary)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.btn.primary:hover{background:var(--accent-hover)}
.layout{display:grid;grid-template-columns:1fr 320px;gap:16px}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.drop{min-height:320px;border:2px dashed var(--border);border-radius:var(--radius);margin:14px;padding:40px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:.15s}
.drop.drag{border-color:var(--accent);background:var(--accent-light)}
.drop-icon{font-size:42px;margin-bottom:12px}
.drop h2{font-size:18px;margin-bottom:6px}.drop p{color:var(--text-muted);font-size:13px;margin-bottom:18px}
.file-list{border-top:1px solid var(--border);max-height:420px;overflow:auto}
.file-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border-light)}
.file-icon{font-size:19px;width:26px;text-align:center}
.file-main{min-width:0;flex:1}.file-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.file-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
.file-actions{display:flex;gap:5px}.icon-btn{border:0;background:transparent;color:var(--text-muted);padding:5px}
.icon-btn:hover{color:var(--danger)}
.side{padding:16px}
.side h3{font-size:14px;margin-bottom:12px}
.connection{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-family:var(--font-mono);font-size:11px;word-break:break-all}
.qr{display:block;width:210px;height:210px;object-fit:contain;margin:14px auto;border-radius:6px;background:#fff;padding:6px}
.hint{font-size:12px;color:var(--text-muted);line-height:1.55}
.empty{padding:28px;text-align:center;color:var(--text-muted);font-size:13px}
.status{font-size:12px;color:var(--text-muted);min-height:18px;margin-top:10px}
.error{color:var(--danger)}
.ok{color:var(--success)}
@media(max-width:780px){
 body{padding:12px}.layout{grid-template-columns:1fr}.side{order:-1}
 .qr{width:160px;height:160px}.drop{min-height:230px}
 header{align-items:flex-start}.toolbar{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">📲</div>
    <div><h1>File Transfer</h1><div class="subtitle">PC ↔ Mobile · Local network</div></div>
  </div>
  <div class="toolbar">
    <button class="btn" id="themeBtn">🌓 Dark</button>
    <button class="btn" onclick="refreshFiles()">↻ Refresh</button>
  </div>
</header>

<div class="layout">
  <section class="card">
    <div class="drop" id="drop">
      <div class="drop-icon">⇅</div>
      <h2>Drop files here</h2>
      <p>Files stay on this local network. Nothing is uploaded to the internet.</p>
      <button class="btn primary" onclick="fileInput.click()">Choose files</button>
      <input id="fileInput" type="file" multiple hidden>
      <div class="status" id="status"></div>
    </div>
    <div class="file-list" id="fileList"></div>
  </section>

  <aside class="card side">
    <h3>Connect your phone</h3>
    <img class="qr" id="qr" alt="Connection QR code">
    <div class="connection" id="connection">Connecting…</div>
    <p class="hint" style="margin-top:12px">
      Scan the QR code with your phone. Both devices must be connected to the same Wi-Fi/LAN.
      Keep this page open while transferring.
    </p>
  </aside>
</div>
</div>

<script>
const params = new URLSearchParams(location.search);
let token = params.get('token') || '';
const root = location.origin;
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const statusEl = document.getElementById('status');
const connection = document.getElementById('connection');
const qr = document.getElementById('qr');
const themeBtn = document.getElementById('themeBtn');

function setTheme(theme){
  document.documentElement.dataset.theme = theme;
  localStorage.setItem('utils-theme', theme);
  themeBtn.textContent = theme === 'dark' ? '☀️ Light' : '🌓 Dark';
}
setTheme(localStorage.getItem('utils-theme') || 'light');
themeBtn.onclick = () => setTheme((localStorage.getItem('utils-theme') || 'light') === 'dark' ? 'light' : 'dark');

function fmt(bytes){
  if(bytes < 1024) return bytes+' B';
  if(bytes < 1048576) return (bytes/1024).toFixed(1)+' KB';
  if(bytes < 1073741824) return (bytes/1048576).toFixed(2)+' MB';
  return (bytes/1073741824).toFixed(2)+' GB';
}
function icon(name){
  const ext = name.split('.').pop().toLowerCase();
  if(['png','jpg','jpeg','gif','webp','bmp','svg','ico'].includes(ext)) return '🖼️';
  if(['zip','rar','7z','tar','gz'].includes(ext)) return '🗜️';
  if(['mp4','mkv','mov','avi','webm'].includes(ext)) return '🎬';
  if(['mp3','wav','flac','m4a'].includes(ext)) return '🎵';
  if(['pdf'].includes(ext)) return '📕';
  if(['doc','docx','txt','md'].includes(ext)) return '📄';
  return '📦';
}
async function api(path, options={}){
  const url = `${path}${path.includes('?')?'&':'?'}token=${encodeURIComponent(token)}`;
  const res = await fetch(url, options);
  if(!res.ok){
    let msg = 'Request failed';
    try { msg = (await res.json()).detail || msg; } catch {}
    throw new Error(msg);
  }
  return res;
}
async function init(){
  if(!token){
    statusEl.textContent = 'Open this page from the QR code or the URL printed by the server.';
    statusEl.className = 'status error';
    return;
  }
  try{
    const res = await api('/api/session');
    const data = await res.json();
    connection.textContent = `http://${data.ip}:8765/?token=${data.token}`;
    qr.src = `/qr?token=${encodeURIComponent(token)}`;
    await refreshFiles();
  }catch(e){
    statusEl.textContent = e.message;
    statusEl.className = 'status error';
  }
}
async function refreshFiles(){
  try{
    const res = await api('/api/files');
    const files = await res.json();
    if(!files.length){
      fileList.innerHTML = '<div class="empty">No files yet. Upload something from either device.</div>';
      return;
    }
    fileList.innerHTML = files.map(f => `
      <div class="file-row">
        <div class="file-icon">${icon(f.name)}</div>
        <div class="file-main">
          <div class="file-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
          <div class="file-meta">${fmt(f.size)}</div>
        </div>
        <div class="file-actions">
          <button class="icon-btn" title="Download" onclick="downloadFile('${encodeURIComponent(f.name)}')">↓</button>
          <button class="icon-btn" title="Delete" onclick="deleteFile('${encodeURIComponent(f.name)}')">×</button>
        </div>
      </div>`).join('');
  }catch(e){
    statusEl.textContent = e.message;
    statusEl.className = 'status error';
  }
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function downloadFile(name){
  location.href = `/api/download/${name}?token=${encodeURIComponent(token)}`;
}
async function deleteFile(name){
  if(!confirm('Delete this file from the transfer queue?')) return;
  try{ await api(`/api/files/${name}`, {method:'DELETE'}); await refreshFiles(); }
  catch(e){ statusEl.textContent=e.message; statusEl.className='status error'; }
}
async function uploadFiles(files){
  for(const file of files){
    const data = new FormData();
    data.append('file', file);
    statusEl.className='status';
    statusEl.textContent=`Uploading ${file.name}…`;
    try{
      await api('/api/upload', {method:'POST', body:data});
      statusEl.textContent=`✓ Uploaded ${file.name}`;
      statusEl.className='status ok';
    }catch(e){
      statusEl.textContent=`✗ ${file.name}: ${e.message}`;
      statusEl.className='status error';
    }
  }
  await refreshFiles();
}
fileInput.addEventListener('change', e => uploadFiles([...e.target.files]));
['dragenter','dragover'].forEach(type => drop.addEventListener(type, e => {
  e.preventDefault(); drop.classList.add('drag');
}));
['dragleave','drop'].forEach(type => drop.addEventListener(type, e => {
  e.preventDefault(); drop.classList.remove('drag');
}));
drop.addEventListener('drop', e => uploadFiles([...e.dataTransfer.files]));
init();
</script>
</body>
</html>
