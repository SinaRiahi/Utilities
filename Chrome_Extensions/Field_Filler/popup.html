<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
<script src="/_aistudio-iframe.js?v=2f1c016a"></script></head>
<body>
  <div class="header">
    <h3>Field Filler</h3>
  </div>
  <div class="content">
    <div class="toggle-container">
      <span class="toggle-label">Auto-Fill Active</span>
      <label class="switch">
        <input type="checkbox" id="toggle-active">
        <span class="slider"></span>
      </label>
    </div>
    <hr class="divider">
    <button id="btn-collect" class="btn primary">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      Copy Current Fields
    </button>
    <button id="btn-fill" class="btn secondary">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      Auto-Fill Page
    </button>
    <div id="status">Ready.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
