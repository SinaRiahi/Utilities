<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Scanner Core Cyan/Blue Glow -->
    <radialGradient id="scannerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="1" />
      <stop offset="35%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Eye Lens Reflection -->
    <linearGradient id="lensShine" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Icon Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" />

  <!-- Background Tech Grid / Circuit traces -->
  <g opacity="0.3" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round">
    <path d="M 16 36 L 36 36 L 46 26" fill="none" />
    <path d="M 112 36 L 92 36 L 82 26" fill="none" />
    <path d="M 16 92 L 36 92 L 46 102" fill="none" />
    <path d="M 112 92 L 92 92 L 82 102" fill="none" />
    <circle cx="16" cy="36" r="2" fill="#38bdf8" />
    <circle cx="112" cy="36" r="2" fill="#38bdf8" />
    <circle cx="16" cy="92" r="2" fill="#38bdf8" />
    <circle cx="112" cy="92" r="2" fill="#38bdf8" />
  </g>

  <!-- Robotic Outer Chassis Ring -->
  <circle cx="64" cy="64" r="46" fill="#0f172a" stroke="#1e293b" stroke-width="4" />
  
  <!-- Outer Aperture Tick Marks -->
  <g stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="64" y1="14" x2="64" y2="20" />
    <line x1="64" y1="108" x2="64" y2="114" />
    <line x1="14" y1="64" x2="20" y2="64" />
    <line x1="108" y1="64" x2="114" y2="64" />
  </g>

  <!-- Corner Targeting Reticles / Brackets -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 30 42 L 30 30 L 42 30" />
    <path d="M 98 42 L 98 30 L 86 30" />
    <path d="M 30 86 L 30 98 L 42 98" />
    <path d="M 98 86 L 98 98 L 86 98" />
  </g>

  <!-- Rotating Sensor Ring / HUD Segments -->
  <circle cx="64" cy="64" r="38" fill="#020617" stroke="#0369a1" stroke-width="2" stroke-dasharray="16 8 8 8" />
  <circle cx="64" cy="64" r="32" fill="#030712" stroke="#0284c7" stroke-width="1.5" />

  <!-- Glowing Scanner Core Iris -->
  <circle cx="64" cy="64" r="26" fill="url(#scannerGlow)" filter="url(#glow)" />
  <circle cx="64" cy="64" r="26" fill="url(#lensShine)" />

  <!-- Robotic Pupil / Inner Sensor -->
  <circle cx="64" cy="64" r="14" fill="#090d16" stroke="#22d3ee" stroke-width="2" />
  <circle cx="64" cy="64" r="7" fill="#67e8f9" filter="url(#glow)" />
  <circle cx="64" cy="64" r="3" fill="#ffffff" />

  <!-- Crosshair Reticle Center -->
  <g stroke="#67e8f9" stroke-width="1.5" opacity="0.9">
    <line x1="64" y1="44" x2="64" y2="54" />
    <line x1="64" y1="74" x2="64" y2="84" />
    <line x1="44" y1="64" x2="54" y2="64" />
    <line x1="74" y1="64" x2="84" y2="64" />
  </g>

  <!-- Horizontal Laser Scan Sweep Line -->
  <path d="M 22 64 L 106 64" stroke="url(#laserGrad)" stroke-width="3.5" filter="url(#glow)" />
  <line x1="38" y1="64" x2="90" y2="64" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

  <!-- Scanner Data Indicator Dots -->
  <circle cx="78" cy="46" r="2" fill="#38bdf8" />
  <circle cx="84" cy="50" r="1.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="50" cy="82" r="2" fill="#22d3ee" />
</svg>
