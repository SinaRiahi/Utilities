<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AutoScope</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a2e;
            --border: #dee2e6;
            --accent: #4c6ef5;
            --accent-hover: #3b5de7;
            --bg-secondary: #f8f9fa;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1b1e;
                --text: #e4e6ea;
                --border: #3a3c42;
                --bg-secondary: #25262b;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            width: 320px;
            background: var(--bg);
            color: var(--text);
        }
        h2 {
            margin: 0 0 12px 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        p {
            font-size: 13px;
            margin: 0 0 16px 0;
            color: #888;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: var(--accent-hover);
        }
        button.secondary {
            background: var(--bg-secondary);
            color: var(--text);
            border: 1px solid var(--border);
        }
        button.secondary:hover {
            background: var(--border);
        }
        .status {
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            min-height: 16px;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <h2><img src="icon48.png" width="24" height="24" style="border-radius:6px;vertical-align:middle;" /> AutoScope</h2>
    <p>Scan the page or pick elements to generate robust selectors for automation.</p>
    
    <button id="btnScan">📊 Scan Full Page (Extract All)</button>
    <button id="btnInspect" class="secondary">🔍 Toggle Inspect Mode</button>
    
    <div class="status" id="statusMsg"></div>

    <script src="popup.js"></script>
</body>
</html>
